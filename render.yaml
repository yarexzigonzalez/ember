# Render blueprint: just the API, on the free plan.
# Database lives on Neon (free, doesn't expire). Demo reset runs on GitHub Actions (free).
services:
  - type: web
    name: ember-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    # migrations run on every boot; alembic no-ops if there's nothing new
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: LOG_CLIENT_IP
        value: "false"
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # optional, leave blank for regex-only quick add
