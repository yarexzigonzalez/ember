services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
      POSTGRES_DB: ember
    ports:
      # Host 5433 in case a local Postgres already owns 5432.
      - "5433:5432"
    volumes:
      - ember_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ember_pgdata:
