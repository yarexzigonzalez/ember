# Render blueprint: API + Postgres + nightly demo reset.
# New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: ember-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    # migrations run on every boot; alembic no-ops if there's nothing new
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: ember-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: LOG_CLIENT_IP
        value: "false"
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # you paste this one in the dashboard

  - type: cron
    name: ember-demo-reset
    runtime: python
    rootDir: backend
    plan: starter
    # 10:00 UTC = 2-3am in LA depending on DST
    schedule: "0 10 * * *"
    buildCommand: pip install .
    startCommand: python -m scripts.reset_demo
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: ember-db
          property: connectionString

databases:
  - name: ember-db
    plan: free
    databaseName: ember
    user: ember
